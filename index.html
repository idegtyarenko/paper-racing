<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Paper Racing</title>
    <link rel="icon" href="/paper-racing/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/paper-racing/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d3252" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Racing" />
    <!-- Boot guard against a flash of unstyled markup. The body below is static
         HTML, so the browser can paint it before index.css applies — in dev the
         stylesheet arrives as a <style> injected by main.ts, and on a slow network
         it lands late in production too. Unstyled, that paints a white page with a
         serif 🏁 heading and a viewBox-only <svg> blown up to its 300×150 default.
         Hide the shell until the real stylesheet un-hides it: `.app` gets
         `visibility: visible` back in layout.css, which always comes after this
         inline rule in the head, so it wins at equal specificity. -->
    <style>
      html {
        background: #0d3252; /* --pr-board, so the gap reads as the board */
      }
      .app {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="app__board">
        <canvas id="board"></canvas>
        <div class="zoom-ctl" aria-hidden="true">
          <button id="zoomIn" type="button" class="zoom-ctl__btn">＋</button>
          <button id="zoomOut" type="button" class="zoom-ctl__btn">－</button>
        </div>
      </div>
    </div>
    <!-- Empty mount point for the modal sheets: each one is built by its owner
         module on first open (ui/dialogs.ts, ui/confirm.ts). -->
    <div id="overlay" class="pr-overlay" hidden>
      <div class="pr-overlay__backdrop"></div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <div id="connBanner" class="pr-conn" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
