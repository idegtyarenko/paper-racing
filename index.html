<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Paper Racing</title>
    <link rel="icon" href="/paper-racing/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/paper-racing/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d3252" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Racing" />
    <!-- Boot guard against a flash of unstyled markup. The body below is static
         HTML, so the browser can paint it before index.css applies — in dev the
         stylesheet arrives as a <style> injected by main.ts, and on a slow network
         it lands late in production too. Unstyled, that paints a white page with a
         serif 🏁 heading and a viewBox-only <svg> blown up to its 300×150 default.
         Hide the shell until the real stylesheet un-hides it: `.app` gets
         `visibility: visible` back in layout.css, which always comes after this
         inline rule in the head, so it wins at equal specificity. -->
    <style>
      html {
        background: #0d3252; /* --pr-board, so the gap reads as the board */
      }
      .app {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="app__board">
        <canvas id="board"></canvas>
        <div class="zoom-ctl" aria-hidden="true">
          <button id="zoomIn" type="button" class="zoom-ctl__btn">＋</button>
          <button id="zoomOut" type="button" class="zoom-ctl__btn">－</button>
        </div>
        <!-- Confirm-move and skip-turn: re-parented into the race chrome's action
             zone on first show (ui/race-chrome.ts), which is also where they get
             their look. They stay here so their handlers can be bound up front. -->
        <button
          id="confirmMove"
          type="button"
          data-i18n="buttons.confirmMove"
          hidden
        ></button>
        <!-- Skip a stalling player's turn (online only): the race chrome sets the
             text — online.skipTurnBtn plus the stuck player's name, in their colour. -->
        <button id="skipTurn" type="button" hidden></button>
      </div>
      <aside class="panel">
        <header class="panel__header">
          <h1 class="panel__title" data-i18n="app.title">🏁 Paper Racing</h1>
          <div class="panel__header-actions">
            <button
              id="helpBtn"
              class="header-btn"
              data-i18n="buttons.rulesTitle"
              data-i18n-aria-label="buttons.rulesTitle"
              data-i18n-title="buttons.rulesTitle"
              aria-label="Rules"
              title="Rules"
            ></button>
          </div>
        </header>
        <div class="status"></div>
        <div id="editButtons" class="panel__group">
          <button
            id="nextBtn"
            class="button button--center"
            data-i18n="buttons.next"
            hidden
          ></button>
          <button id="backBtn" class="button button--center" data-i18n="buttons.back">
            ← Back
          </button>
          <button id="joinByCode" class="button button--center" type="button">
            <span class="join-ico" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <ellipse cx="12" cy="12" rx="4" ry="9" />
                <path d="M3 12h18M4.5 7.5h15M4.5 16.5h15" />
              </svg>
            </span>
            <span data-i18n="online.joinByCode"></span>
          </button>
        </div>
      </aside>
    </div>
    <div id="overlay" class="overlay" hidden>
      <div class="overlay__backdrop"></div>
      <div id="rulesSheet" class="sheet" hidden>
        <h2 class="sheet__title" data-i18n="buttons.rulesTitle"></h2>
        <p class="rules__text" data-i18n="rules.body"></p>
        <button
          class="button button--center"
          data-i18n="buttons.toWheel"
          data-close
        ></button>
        <p id="appVersion" class="rules__version" aria-hidden="true"></p>
      </div>
      <div id="joinDialog" class="sheet" hidden>
        <h2 class="sheet__title" data-i18n="online.joinTitle"></h2>
        <input
          id="joinCodeInput"
          class="field field--code"
          type="text"
          maxlength="5"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          data-i18n-placeholder="online.codePlaceholder"
        />
        <div id="joinError" class="dialog-error" hidden></div>
        <button
          id="joinConfirm"
          class="button button--primary"
          data-i18n="online.joinSubmit"
        ></button>
        <button
          class="button button--center"
          data-i18n="buttons.cancel"
          data-close
        ></button>
      </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <div id="connBanner" class="conn-banner" hidden data-i18n="online.reconnecting"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
